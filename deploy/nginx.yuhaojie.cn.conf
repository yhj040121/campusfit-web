server {
    listen 80;
    listen [::]:80;
    server_name www.yuhaojie.cn;
    return 301 https://yuhaojie.cn$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name yuhaojie.cn;
    return 301 https://yuhaojie.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yuhaojie.cn;

    ssl_certificate /etc/letsencrypt/live/yuhaojie.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuhaojie.cn/privkey.pem;

    return 301 https://yuhaojie.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yuhaojie.cn;

    ssl_certificate /etc/letsencrypt/live/yuhaojie.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuhaojie.cn/privkey.pem;

    root /var/www/yuhaojie.cn;
    index index.html;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }
}
